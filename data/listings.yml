# One entry per role. The README tables are generated from this file:
#   python3 scripts/generate_readme.py
#
# Fields
#   company        Company name
#   role           Role title as written in the ad
#   category       software | data | cyber | quant | finance | consulting | engineering | design | business
#   country        List: [AU], [NZ] or [AU, NZ]
#   locations      List of cities, e.g. [Sydney, Melbourne]. Use [Multiple] if many.
#   intake         Which cohort, e.g. "Summer 2027/28"
#   opens/closes   Optional. "YYYY-MM-DD" if known, otherwise short text like "Feb 2027 (usual)"
#   international  yes | no | conditional | unknown   (can student visa holders apply?)
#                    yes          open to student visa holders
#                    no           citizens / permanent residents only
#                    conditional  depends on work rights, office or team (explain in eligibility)
#   sponsorship    yes | no | unknown   (does the company sponsor visas for this role?)
#   eligibility    The eligibility wording from the ad. Quote it exactly once verified.
#   verified       true  = someone read the official ad and copied the wording
#                  false = taken from a secondary source; needs checking
#   link           Official careers page or job ad
#   last_checked   "YYYY-MM-DD"
#   status         open | upcoming | closed
#   notes          Optional

