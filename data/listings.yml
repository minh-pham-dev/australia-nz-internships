# Reviewed roles only. The README tables are generated from this file:
#   python3 scripts/generate_readme.py
#
# Each entry describes one program and has two parts:
#   1. The 2027/28 round (the one people are preparing for): status, expected opening, apply link.
#   2. The last round (2026/27, now expired), used as a reference for what to expect.
#
# Fields
#   company          Company name
#   role             Program / role name
#   category         software | data | cyber | quant | finance | consulting | engineering | design | business
#   country          List: [AU], [NZ] or [AU, NZ]
#   locations        List of cities, e.g. [Sydney, Melbourne]. Use [Multiple] if many.
#   careers_page     The company's own careers page for this program
#   study_year       Who can apply, short: "Penultimate year", "Final year", "Any year"
#   study_year_detail  Optional, short, from the last ad: "graduating by Jan 2028" (not shown)
#   duration         How long the program runs, e.g. "12 weeks". Use "Not stated" if the source doesn't say.
#
#   -- 2027/28 round --
#   status           not_open | open | closed
#   expected_open    When it's expected to open, short, e.g. "Feb–Jun 2027" or "Not announced"
#   last_opened      Optional. When last round's ad came out (shown on click), e.g. "opened 5 May 2026".
#                    Leave it out if the source doesn't say; the cell then has nothing to click.
#   apply_link       Required once status is open: the live ad
#   posted           Required once status is open: "YYYY-MM-DD" the live ad went up (shown as its age, e.g. "3d old")
#   closes           Optional. "YYYY-MM-DD" once the live ad shows a closing date
#
#   -- Last round (reference) --
#   last_round       e.g. "2026/27"
#   last_round_dates Optional. What happened last time, e.g. "Program ran Nov 2026 – Feb 2027"
#   international    yes | no | conditional | unknown   (could student visa holders apply last round?)
#   summary          What readers see when they click: the rule in plain English, under 120 characters.
#                    Must match the eligibility quote below. Don't add anything the ad doesn't say.
#   sponsorship      Optional: yes | no | unknown (kept for reference, not shown in the README)
#   eligibility      Exact wording copied from the source (not shown in the README; it's the proof)
#   other_requirements  Optional, shown on click as "Also needs: …". Only requirements stated in the source,
#                    e.g. a credit average, a specific degree, an English test. Under 120 characters.
#   source           URL where the wording can be read right now
#   source_note      Short label for the source link, e.g. "Atlassian careers site" or
#                    "copy on Accel's job board" (when the company took the original down)
#
#   last_checked     "YYYY-MM-DD"
#   notes            Optional

