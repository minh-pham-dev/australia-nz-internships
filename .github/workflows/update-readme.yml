name: Update README

on:
  # Every day at 20:00 UTC (6–7am in Melbourne/Sydney), so job ages stay correct.
  schedule:
    - cron: "0 20 * * *"
  # Whenever the data or the script changes on main.
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
  # Check contributors' changes before they're merged.
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
  # A "Run workflow" button on the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate the data
        run: python scripts/generate_readme.py --check

      - name: Rebuild the README
        run: python scripts/generate_readme.py

      - name: Commit if anything changed
        # Only on main, never on pull requests.
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Rebuild README (automatic)"
          git push
